site_name: geosae
site_description: Sparse autoencoders for Earth embeddings
site_url: https://earthyscience.github.io/geosae/
repo_url: https://github.com/EarthyScience/geosae
repo_name: EarthyScience/geosae

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Building a dataset: dataset.md
  - Training: training.md
  - Inference: inference.md
  - Concepts and factors: concepts.md
  - Evaluation: evaluation.md
  - NeurIPS 2026 paper:
      - Overview: neurips2026/index.md
      - "Reproducing: data and training": neurips2026/reproduce-data.md
      - Reproducing figures and tables: neurips2026/reproduce-figures.md
  - API reference: api.md

theme:
  name: material
  logo: assets/logo/geosae-icon-dark.svg
  favicon: assets/logo/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            show_source: true
