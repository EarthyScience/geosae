[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geosae"
dynamic = ["version"]
description = "Sparse autoencoders for Earth embeddings: training, inference and evaluation against reference products."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vitus Benson" }]
keywords = [
    "sparse autoencoder",
    "interpretability",
    "earth observation",
    "embeddings",
    "remote sensing",
    "geospatial",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "zarr>=3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
# Fetching reference products and assembling a patch store (geosae.data.download).
download = [
    "certifi",
    "requests",
    "rasterio",
    "pyproj",
    "shapely",
    "geopandas",
    "odc-geo",
    "pystac-client",
    "planetary-computer",
    "s3fs",
    "duckdb",
    "earthaccess",
    "earthengine-api",
    "geotessera>=0.11",
    "huggingface-hub",
]
# Encoding Sentinel-2 patches with further foundation models (geosae.data.embed).
embed = [
    "olmoearth-pretrain-minimal>=0.0.2",
    "tensorboardx>=2.6.5",
    "timm>=1.0.28",
]
# Figures of the paper scripts.
viz = ["nicefigs>=1.0", "matplotlib>=3.7"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=3.7",
    "ruff==0.15.0",
]

[project.urls]
Homepage = "https://github.com/EarthyScience/geosae"
Documentation = "https://earthyscience.github.io/geosae"
Source = "https://github.com/EarthyScience/geosae"
Issues = "https://github.com/EarthyScience/geosae/issues"

[project.scripts]
geosae = "geosae.cli:main"

[tool.hatch.version]
path = "geosae/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["geosae"]

# The general configs ship inside the package, so `geosae train -c batchtopk` works after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"configs" = "geosae/configs"

[tool.hatch.build.targets.sdist]
include = ["geosae", "tests", "configs", "README.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

# A bare `pytest` would otherwise recurse into the `runs/`, `data/` and `logs/` directories.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["geosae"]
omit = ["tests/*"]
